name: Build ChessAssist APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag release yang berisi zip source (kosong = release terbaru)"
        required: false
        default: ""
      emulator:
        description: "Jalankan juga tes Stockfish di emulator (lambat, opsional)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.run_id }}
  cancel-in-progress: false

env:
  NDK_VERSION: "27.2.12479018"
  RELEASE_TAG: ${{ github.event.inputs.tag }}

jobs:
  build:
    name: Build, test, package
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Ambil zip source dari GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG:-}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // empty')
          fi
          if [ -z "$TAG" ]; then
            echo "Belum ada Release (non-draft) di repo ini. Buat Release dan attach zip source."; exit 1
          fi
          echo "Release: $TAG"
          DL="$RUNNER_TEMP/dl"; EX="$RUNNER_TEMP/ex"
          rm -rf "$DL" "$EX"; mkdir -p "$DL" "$EX"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --dir "$DL"
          COUNT=$(find "$DL" -maxdepth 1 -name '*.zip' | wc -l)
          if [ "$COUNT" -ne 1 ]; then
            echo "Release harus punya tepat 1 asset .zip, ketemu $COUNT"; ls -l "$DL"; exit 1
          fi
          unzip -q "$DL"/*.zip -d "$EX"
          GW=$(find "$EX" -maxdepth 3 -name gradlew -not -path '*/__MACOSX/*' -print -quit)
          if [ -z "$GW" ]; then echo "gradlew tidak ada di zip"; exit 1; fi
          cp -a "$(dirname "$GW")"/. "$GITHUB_WORKSPACE"/
          chmod +x gradlew scripts/*.sh
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK platform, build-tools, pinned NDK
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fontconfig fonts-dejavu-core binutils

      - name: Cache Stockfish sources and NNUE nets
        uses: actions/cache@v4
        with:
          path: build/stockfish-src
          key: stockfish-src-${{ hashFiles('scripts/stockfish.env') }}

      - name: Build Stockfish for Android ARM64 (from official source)
        run: scripts/build-stockfish.sh android-arm64

      - name: Verify Stockfish ARM64 binary (ELF AArch64, PIE, bionic, static libc++)
        run: scripts/verify-stockfish-elf.sh build/stockfish-out/libstockfish.so

      - name: Place Stockfish into jniLibs
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp build/stockfish-out/libstockfish.so app/src/main/jniLibs/arm64-v8a/libstockfish.so
          chmod 755 app/src/main/jniLibs/arm64-v8a/libstockfish.so
          sha256sum app/src/main/jniLibs/arm64-v8a/libstockfish.so | tee build/libstockfish.sha256
          cp build/stockfish-out/BUILD_INFO.txt build/stockfish-build-info.txt

      - name: Build Stockfish for host (x86-64) used by engine unit tests
        env:
          SF_OUT: ${{ github.workspace }}/build/stockfish-host-out
        run: scripts/build-stockfish.sh host-x86-64

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests, lint, assemble debug APK
        env:
          CI: "true"
          STOCKFISH_BIN: ${{ github.workspace }}/build/stockfish-host-out/stockfish-host
        run: ./gradlew --stacktrace testDebugUnitTest lintDebug assembleDebug verifyStockfishInApk

      - name: Inspect APK contents
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          ls -lh "$APK"
          unzip -l "$APK" | grep -E "lib/arm64-v8a/libstockfish.so" || { echo "libstockfish.so TIDAK ada di APK"; exit 1; }
          unzip -l "$APK" | grep -E "lib/" | grep -v "lib/arm64-v8a/" && { echo "ABI tak terduga di APK"; exit 1; } || true
          unzip -l "$APK" | grep -E "assets/licenses/STOCKFISH_NOTICE.txt" || { echo "informasi lisensi tidak ada di APK"; exit 1; }
          unzip -p "$APK" lib/arm64-v8a/libstockfish.so | sha256sum | awk '{print $1}' > build/apk-so.sha256
          awk '{print $1}' build/libstockfish.sha256 | diff - build/apk-so.sha256 && echo "SHA256 libstockfish.so di APK == hasil build"
          BT="${ANDROID_HOME}/build-tools/35.0.0"
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|sdkVersion|targetSdkVersion|native-code|uses-permission"
          "$BT/apksigner" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ChessAssist-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build/stockfish-build-info.txt
            build/libstockfish.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  android-engine-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.emulator == true }}
    name: Jalankan Stockfish di emulator Android (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Ambil zip source dari GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG:-}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // empty')
          fi
          if [ -z "$TAG" ]; then
            echo "Belum ada Release (non-draft) di repo ini. Buat Release dan attach zip source."; exit 1
          fi
          echo "Release: $TAG"
          DL="$RUNNER_TEMP/dl"; EX="$RUNNER_TEMP/ex"
          rm -rf "$DL" "$EX"; mkdir -p "$DL" "$EX"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --dir "$DL"
          COUNT=$(find "$DL" -maxdepth 1 -name '*.zip' | wc -l)
          if [ "$COUNT" -ne 1 ]; then
            echo "Release harus punya tepat 1 asset .zip, ketemu $COUNT"; ls -l "$DL"; exit 1
          fi
          unzip -q "$DL"/*.zip -d "$EX"
          GW=$(find "$EX" -maxdepth 3 -name gradlew -not -path '*/__MACOSX/*' -print -quit)
          if [ -z "$GW" ]; then echo "gradlew tidak ada di zip"; exit 1; fi
          cp -a "$(dirname "$GW")"/. "$GITHUB_WORKSPACE"/
          chmod +x gradlew scripts/*.sh
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned NDK
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;34.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build Stockfish for Android x86_64 (emulator)
        run: |
          SF_OUT="$PWD/build/stockfish-x86_64-out" scripts/build-stockfish.sh android-x86_64
          mkdir -p app/src/main/jniLibs/x86_64
          cp build/stockfish-x86_64-out/libstockfish.so app/src/main/jniLibs/x86_64/libstockfish.so

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Instrumented engine test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: ./gradlew -Pabi=x86_64 connectedDebugAndroidTest --stacktrace
