name: Build ChessAssist APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  STOCKFISH_REF: sf_19
  ANDROID_NDK_VERSION: 27.2.12479018

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout ChessAssist
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;${ANDROID_NDK_VERSION}"
          echo "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Build Stockfish for Android ARM64
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch "${STOCKFISH_REF}" https://github.com/official-stockfish/Stockfish.git stockfish-src
          cd stockfish-src/src
          make net
          make -j2 build ARCH=armv8 COMP=ndk
          make strip ARCH=armv8 COMP=ndk
          file stockfish
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          install -m 755 stockfish "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libstockfish.so"
          cp ../Copying.txt "$GITHUB_WORKSPACE/THIRD_PARTY_STOCKFISH_LICENSE.txt"
          printf 'Stockfish source: https://github.com/official-stockfish/Stockfish/tree/%s\n' "$STOCKFISH_REF" > "$GITHUB_WORKSPACE/THIRD_PARTY_STOCKFISH_SOURCE.txt"

      - name: Verify engine binary architecture
        run: |
          file app/src/main/jniLibs/arm64-v8a/libstockfish.so
          readelf -h app/src/main/jniLibs/arm64-v8a/libstockfish.so | grep -E 'Class:|Machine:'

      - name: Build debug APK
        run: gradle --no-daemon clean testDebugUnitTest lintDebug assembleDebug

      - name: Verify APK contains Stockfish
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libstockfish.so'

      - name: Upload APK and license
        uses: actions/upload-artifact@v4
        with:
          name: ChessAssist-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            THIRD_PARTY_STOCKFISH_LICENSE.txt
            THIRD_PARTY_STOCKFISH_SOURCE.txt
            THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
          retention-days: 14
