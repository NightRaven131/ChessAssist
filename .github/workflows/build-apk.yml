name: Build ChessAssist APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 34
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Download source ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/chessassist

          gh release download build \
            --repo "${{ github.repository }}" \
            --pattern "ChessAssist-source-FIXED.zip" \
            --dir /tmp/chessassist \
            --clobber

          test -s /tmp/chessassist/ChessAssist-source-FIXED.zip

      - name: Extract source
        run: |
          rm -rf /tmp/source
          mkdir -p /tmp/source

          unzip -q \
            /tmp/chessassist/ChessAssist-source-FIXED.zip \
            -d /tmp/source

          SOURCE_ROOT="$(find /tmp/source -type f -name settings.gradle -printf '%h\n' | head -1)"

          if [ -z "$SOURCE_ROOT" ]; then
            echo "ERROR: settings.gradle not found"
            find /tmp/source -maxdepth 4 -type f -print
            exit 1
          fi

          echo "SOURCE_ROOT=$SOURCE_ROOT" >> "$GITHUB_ENV"

      - name: Copy source into workspace
        run: |
          cp -a "$SOURCE_ROOT"/. .

          echo "Project files:"
          find . -maxdepth 2 -type f \
            \( \
              -name "*.gradle" \
              -o -name "*.gradle.kts" \
              -o -name "gradle.properties" \
            \) \
            -print

      - name: Download Stockfish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/stockfish

          gh release download build \
            --repo "${{ github.repository }}" \
            --pattern "stockfish-android-armv8.tar" \
            --dir /tmp/stockfish \
            --clobber

          test -s /tmp/stockfish/stockfish-android-armv8.tar

          mkdir -p app/src/main/jniLibs/arm64-v8a

          tar -xf \
            /tmp/stockfish/stockfish-android-armv8.tar \
            -C /tmp/stockfish

          STOCKFISH_BIN="$(
            find /tmp/stockfish -type f \
              \( \
                -name "stockfish-android-armv8" \
                -o -name "libstockfish.so" \
                -o -name "stockfish" \
              \) \
              -print \
              | head -1
          )"

          if [ -z "$STOCKFISH_BIN" ]; then
            echo "ERROR: Stockfish executable not found"
            find /tmp/stockfish -type f -print
            exit 1
          fi

          echo "Found Stockfish: $STOCKFISH_BIN"

          cp "$STOCKFISH_BIN" \
            app/src/main/jniLibs/arm64-v8a/libstockfish.so

          chmod 755 \
            app/src/main/jniLibs/arm64-v8a/libstockfish.so

      - name: Verify project
        run: |
          test -f settings.gradle || test -f settings.gradle.kts
          test -d app
          test -f app/build.gradle || test -f app/build.gradle.kts
          test -s app/src/main/jniLibs/arm64-v8a/libstockfish.so

          echo "Stockfish:"
          file app/src/main/jniLibs/arm64-v8a/libstockfish.so

      - name: Generate Gradle wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper \
              --gradle-version 8.7 \
              --distribution-type bin
          fi

          chmod +x gradlew

      - name: Build APK
        run: |
          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "APK:"
          ls -lh "$APK"
          file "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessAssist-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
